title: Mshta Executing Inline Script or Remote HTA
id: 9908471f-189e-4347-b117-8abba4bdf00c
status: experimental
description: |
  Detects mshta.exe running inline JavaScript/VBScript or loading an HTA from a URL.
  Mshta is a signed proxy that runs script outside the browser's security controls.
references:
  - https://attack.mitre.org/techniques/T1218/005/
  - https://lolbas-project.github.io/lolbas/Binaries/Mshta/
author: Samyam Shrestha
date: 2026-10-06
tags:
  - attack.defense-evasion
  - attack.t1218.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\mshta.exe'
    - OriginalFileName: 'MSHTA.EXE'
  selection_cli:
    CommandLine|contains:
      - 'javascript:'
      - 'vbscript:'
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - Very old line-of-business apps built on HTA launched from an intranet URL
level: high
