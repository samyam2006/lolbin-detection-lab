title: Certutil Used to Download a Remote File
id: 817fee24-cdfd-4e44-9b66-f46da52f3608
status: experimental
description: |
  Detects certutil.exe being used to fetch a file from a URL (urlcache / verifyctl).
  Attackers abuse this signed Windows binary to pull down second-stage payloads
  without dropping a dedicated download tool.
references:
  - https://attack.mitre.org/techniques/T1105/
  - https://lolbas-project.github.io/lolbas/Binaries/Certutil/
author: Samyam Shrestha
date: 2026-10-06
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    # OriginalFileName survives renaming the binary (see docs/techniques/T1105.md)
    - Image|endswith: '\certutil.exe'
    - OriginalFileName: 'CertUtil.exe'
  selection_flag:
    CommandLine|contains:
      - 'urlcache'
      - 'verifyctl'
  selection_url:
    CommandLine|contains:
      - 'http://'
      - 'https://'
      - 'ftp://'
  condition: all of selection_*
falsepositives:
  - Administrative scripts that legitimately fetch certificates or CRLs
level: high
