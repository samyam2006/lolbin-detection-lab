title: Scheduled Task Created With Suspicious Action
id: 5f012cbe-325e-4b94-8812-980b5718cab2
status: experimental
description: |
  Detects schtasks.exe /create where the task action runs a script interpreter or a
  binary from a user-writable folder, a common persistence pattern.
references:
  - https://attack.mitre.org/techniques/T1053/005/
author: Samyam Shrestha
date: 2026-10-06
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.005
logsource:
  product: windows
  category: process_creation
detection:
  selection_img:
    - Image|endswith: '\schtasks.exe'
    - OriginalFileName: 'schtasks.exe'
  selection_create:
    CommandLine|contains: '/create'
  selection_action:
    CommandLine|contains:
      - 'powershell'
      - 'pwsh'
      - 'cmd.exe /c'
      - 'cmd /c'
      - 'mshta'
      - 'wscript'
      - 'cscript'
      - 'rundll32'
      - 'regsvr32'
      - '\AppData\'
      - '\Temp\'
      - '\Users\Public\'
      - 'http://'
      - 'https://'
  condition: all of selection_*
falsepositives:
  - IT automation that schedules PowerShell maintenance scripts (tune with a filter on known task names)
level: medium
